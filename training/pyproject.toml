[project]
name = "nailed-it-training"
version = "0.1.0"
description = "Held-out verification with information-gain reward for the Nailed It reader."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.8",
]

[project.optional-dependencies]
river = [
    "river-client>=0.12",
    "transformers>=4.45",
    "openai>=1.40",
]

[project.scripts]
nailed-it-train = "nailed_it_training.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nailed_it_training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
